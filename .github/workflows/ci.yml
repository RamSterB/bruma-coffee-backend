name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y auditoría
    runs-on: ubuntu-latest

    # Los tests de integración corren contra PostgreSQL real: mockear el
    # QueryBuilder no detectaría un EXISTS mal escrito ni un CHECK que no
    # rechaza lo que debe. La versión se fija para que la CI no valide contra
    # una versión distinta a la de desarrollo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bruma_coffee
      DB_NAME_TEST: bruma_coffee_test

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm (versión fijada en package.json)
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests de integración (PostgreSQL)
        run: pnpm test:integration

      - name: Tests unitarios
        run: pnpm test:unit

      - name: Tests con cobertura
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: Auditoría de dependencias
        run: pnpm audit --audit-level=high
